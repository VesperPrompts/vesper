      const toast = document.getElementById('toast');

      toastMessage.textContent = text;
      toastIcon.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4"></i>`;
      lucide.createIcons({ root: toastIcon });

      toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');

      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
      }, 2400);

    // Copiar Texto com Fallback Seguro
    function copyText(str, msg) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(str)
          .then(() => triggerToast(msg))
          .catch(() => fallbackCopy(str, msg));
      } else {
        fallbackCopy(str, msg);
      }
    }

    function fallbackCopy(str, msg) {
      const ta = document.createElement("textarea");
      ta.value = str;
      ta.style.position = "fixed";
      ta.style.left = "-999999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        triggerToast(msg);
      } catch (err) {
        triggerToast("Falha ao copiar", "alert-circle");
      }
      document.body.removeChild(ta);
    }

    function escapeHtml(text) {
      return (text || '')

        .replace(/'/g, "&#039;");

    // Pausar vídeos que saem da tela com IntersectionObserver
    let observer;
    function initVideoObserver() {
      if (observer) observer.disconnect();

      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target;
          if (!entry.isIntersecting && !video.paused) {
            video.pause();
          }
        });
      }, { threshold: 0.15 });

      document.querySelectorAll('video').forEach(vid => observer.observe(vid));
    }
